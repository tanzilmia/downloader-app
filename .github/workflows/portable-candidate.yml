name: Unsigned portable candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.0.5
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: pnpm engine:portable
      - run: pnpm desktop:bundle
      - name: Archive local candidate with permission bits
        run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Downpour.app output/Downpour-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Downpour-unsigned-local-candidate
          path: output/Downpour-unsigned.zip
          retention-days: 7
