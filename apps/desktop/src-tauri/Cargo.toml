[package]
name = "downpour-desktop"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "downpour_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
native-e2e = ["dep:tauri-plugin-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
download-core = { path = "../../../crates/download-core" }
media-engine = { path = "../../../crates/media-engine" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json.workspace = true
tempfile = "3"
